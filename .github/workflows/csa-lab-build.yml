name: CSA Lab Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and build dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build CSA Lab and installer
        shell: pwsh
        env:
          CSA_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CSA_SIGNING_CERTIFICATE_BASE64 }}
          CSA_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.CSA_SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/Build-CSALab.ps1
      - name: Verify build artifacts
        shell: pwsh
        run: |
          $artifacts = Get-Item `
            dist/CSA-Lab/CSA-Lab.exe, `
            build/collector/CSA-Collector.exe, `
            dist/installer/CSA-Lab-Setup.exe
          $requiredRuntimeFiles = @(
            "dist/CSA-Lab/_internal/policies/windows_endpoint_default.json"
          )
          foreach ($requiredFile in $requiredRuntimeFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Required runtime file is missing: $requiredFile"
            }
          }
          $artifacts | Select-Object FullName, Length
          $checksums = $artifacts | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash
            "$hash  $($_.Name)"
          }
          $checksums | Set-Content `
            -LiteralPath dist/installer/SHA256SUMS.txt `
            -Encoding ascii
      - name: Record installer creation time
        shell: pwsh
        run: |
          $installer = Get-Item -LiteralPath dist/installer/CSA-Lab-Setup.exe
          $createdUtc = [DateTimeOffset]$installer.LastWriteTimeUtc
          $tallinnZone = [TimeZoneInfo]::FindSystemTimeZoneById('FLE Standard Time')
          $createdTallinn = [TimeZoneInfo]::ConvertTime($createdUtc, $tallinnZone)
          $versionMatch = Select-String -LiteralPath packaging/CSA-Lab.nsi -Pattern '^!define PRODUCT_VERSION "([^"]+)"$'
          if (-not $versionMatch) { throw 'Installer version could not be read.' }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $buildInfo = @(
            "## CSA Lab $version installer"
            ''
            "- Installer created (Europe/Tallinn): $($createdTallinn.ToString('yyyy-MM-dd HH:mm:ss zzz'))"
            "- Installer created (UTC): $($createdUtc.ToString('yyyy-MM-dd HH:mm:ss')) UTC"
            "- File: CSA-Lab-Setup.exe"
            "- Commit: $env:GITHUB_SHA"
            "- SHA-256: $hash"
            "- Build: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          )
          $buildInfo | Set-Content -LiteralPath dist/installer/BUILD-INFO.md -Encoding utf8
          $buildInfo | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: CSA-Lab-Setup
          path: |
            dist/installer/CSA-Lab-Setup.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/BUILD-INFO.md
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: CSA-Lab-Windows
          path: |
            dist/CSA-Lab/
            dist/installer/CSA-Lab-Setup.exe
            dist/installer/SHA256SUMS.txt
            dist/installer/BUILD-INFO.md
            build/collector/CSA-Collector.exe
