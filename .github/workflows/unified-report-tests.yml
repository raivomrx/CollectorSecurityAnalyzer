name: CSA Unified Report Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  report:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unified report and 13-endpoint tests
        run: python -W error::ResourceWarning -m unittest tests.test_lab_sprint51.UnifiedReportTests -v
      - name: Verify report semantics from collector evidence
        run: python -W error::ResourceWarning -m unittest tests.test_sprint531_semantics tests.test_sprint531_exposure -v
      - name: Verify Sprint 5.4 intelligence, credentials and cache behavior
        run: python -W error::ResourceWarning -m unittest tests.test_sprint54 -v
      - name: Verify Sprint 5.4.1 product identity and request controls
        run: python -W error::ResourceWarning -m unittest tests.test_sprint541 -v
      - name: Verify Sprint 5.6 identity posture and intelligence semantics
        run: python -W error::ResourceWarning -m unittest tests.test_sprint56 -v
      - name: Verify 5.6.1 vulnerability and administrator reporting
        run: python -W error::ResourceWarning -m unittest tests.test_sprint561_reporting tests.test_effective_admin_membership -v
      - name: Verify independent audit correction and profile privacy
        run: python -W error::ResourceWarning -m unittest tests.test_audit_correction_a tests.test_audit_privacy -v
      - name: Generate and independently verify synthetic audit correction report
        run: python scripts/Generate-AuditCorrectionReport.py --output test-artifacts/CSA-Audit-Correction-A.html
      - name: Generate synthetic 5.6.1 live-review artifact
        run: python scripts/Generate-Sprint561-Review.py --output test-artifacts/CSA-5.6.1-Review.html
      - name: Generate mixed-fleet semantic acceptance report
        run: python scripts/Generate-SemanticsReport.py --output test-artifacts/CSA-Sprint-5.3.1-Semantics.html
      - name: Generate software exposure acceptance report
        run: python scripts/Generate-SemanticsReport.py --software-exposure --output test-artifacts/CSA-Sprint-5.3.1-Software-Exposure.html
      - name: Generate inspectable single-endpoint report
        run: python scripts/Generate-SyntheticUnifiedReport.py --output test-artifacts/CSA-Unified-Assessment-Report.html
      - name: Generate 100-endpoint search performance report
        run: >-
          python scripts/Generate-SyntheticUnifiedReport.py
          --endpoints 100
          --search-fixtures
          --output test-artifacts/CSA-Unified-100-Endpoint-Search-Report.html
      - uses: actions/upload-artifact@v4
        with:
          name: CSA-Unified-Assessment-Report
          path: |
            test-artifacts/CSA-Audit-Correction-A.html
            test-artifacts/CSA-Audit-Correction-A.model.json
            test-artifacts/CSA-Audit-Correction-A.integrity.json
            test-artifacts/CSA-5.6.1-Review.html
            test-artifacts/CSA-5.6.1-Review.model.json
            test-artifacts/CSA-5.6.1-Review.integrity.json
            test-artifacts/CSA-Unified-Assessment-Report.html
            test-artifacts/CSA-Unified-100-Endpoint-Search-Report.html
            test-artifacts/CSA-Sprint-5.3.1-Semantics.html
            test-artifacts/CSA-Sprint-5.3.1-Semantics.model.json
            test-artifacts/CSA-Sprint-5.3.1-Software-Exposure.html
            test-artifacts/CSA-Sprint-5.3.1-Software-Exposure.model.json
